name: manage-azure-policy-a8d7e74f
on:
  workflow_dispatch:
    inputs:
      remarks:
        description: 'Reason for triggering the workflow run'
        required: false
        default: 'Updating Azure Policies'


## Uncomment the following if you wish to automatically trigger workflow run with every commit
#
#  push:
#    paths:
#      - 'policies/Global_|_Required_Group_Tags_for_Resource_Groups_f86f20db-2879-47f6-a516-80ee31801a30/**'
#      - .github/workflows/manage-azure-policy-a8d7e74f.yml
jobs:
  apply-azure-policy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{secrets.AZURE_CREDENTIALS_a8d7e74f}}
        allow-no-subscriptions: true
    - name: Create or Update Azure Policies
      uses: azure/manage-azure-policy@v0
      with:
        paths: |
          policies/Global_|_Required_Group_Tags_for_Resource_Groups_f86f20db-2879-47f6-a516-80ee31801a30/**
